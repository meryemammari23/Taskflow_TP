<p>{{ count() }} tâche(s)</p>
<button (click)="add()">Ajouter une tâche</button>
<button (click)="clear()">Vider la liste</button>

@if (tasks().length === 0) {
  <p class="empty">Aucune tâche pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <app-task-card [task]="task" (completed)="onCompleted($event)" />
    }
  </ul>
}
